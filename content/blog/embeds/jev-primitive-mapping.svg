<svg viewBox="0 0 760 250" role="img" aria-labelledby="t5 d5">
<title id="t5">Mapping Jev primitives to harness score types and CI uses</title>
<desc id="d5">Choice maps to a categorical label used for routing, Score maps to a numeric score used for trends, and Noul maps to a boolean used for pass or fail gates.</desc>
<defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="s-mono" x="20" y="26" fill="var(--muted)">Jev returns</text>
<text class="s-mono" x="270" y="26" fill="var(--muted)">Harness score type</text>
<text class="s-mono" x="520" y="26" fill="var(--muted)">What I use it for</text>
<rect x="20" y="44" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--yellow)" stroke-width=".5"/>
<text class="s-mono" x="120" y="67" text-anchor="middle" dominant-baseline="central" fill="var(--yellow)">Choice</text>
<rect x="270" y="44" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="370" y="67" text-anchor="middle" dominant-baseline="central">Categorical label</text>
<rect x="520" y="44" width="220" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="630" y="67" text-anchor="middle" dominant-baseline="central">Bucket / route failures</text>
<rect x="20" y="106" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--orange)" stroke-width=".5"/>
<text class="s-mono" x="120" y="129" text-anchor="middle" dominant-baseline="central" fill="var(--orange)">Score</text>
<rect x="270" y="106" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="370" y="129" text-anchor="middle" dominant-baseline="central">Numeric score</text>
<rect x="520" y="106" width="220" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="630" y="129" text-anchor="middle" dominant-baseline="central">Track trends per commit</text>
<rect x="20" y="168" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--purple)" stroke-width=".5"/>
<text class="s-mono" x="120" y="191" text-anchor="middle" dominant-baseline="central" fill="var(--purple)">Noul (yes/no)</text>
<rect x="270" y="168" width="200" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="370" y="191" text-anchor="middle" dominant-baseline="central">Boolean</text>
<rect x="520" y="168" width="220" height="46" rx="6" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="630" y="191" text-anchor="middle" dominant-baseline="central">Pass / fail CI gate</text>
<g class="s-arr" stroke="var(--soft)">
<line x1="222" y1="67" x2="266" y2="67" marker-end="url(#a5)"/><line x1="472" y1="67" x2="516" y2="67" marker-end="url(#a5)"/>
<line x1="222" y1="129" x2="266" y2="129" marker-end="url(#a5)"/><line x1="472" y1="129" x2="516" y2="129" marker-end="url(#a5)"/>
<line x1="222" y1="191" x2="266" y2="191" marker-end="url(#a5)"/><line x1="472" y1="191" x2="516" y2="191" marker-end="url(#a5)"/>
</g>
<text class="s-sub" x="20" y="240">Every primitive carries a calibrated probability, so gates can threshold on p.</text>
</svg>
