<svg viewBox="0 0 680 400" role="img" aria-labelledby="t1 d1">
<title id="t1">LLM-as-a-judge versus Jev-as-a-judge</title>
<desc id="d1">Left: a sequential LLM judge pipeline ending in fragile JSON parsing. Right: a single Jev call returning Choice, Score and Noul in parallel.</desc>
<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="24" y="30" width="292" height="290" rx="10" fill="var(--bg-deep)" stroke="var(--border-md)" stroke-width=".5"/>
<rect x="364" y="30" width="292" height="290" rx="10" fill="var(--bg-deep)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-mono" x="44" y="58" fill="var(--pink)">LLM-as-a-judge</text>
<text class="s-mono" x="384" y="58" fill="var(--green)">Jev-as-a-judge</text>
<rect x="55" y="84" width="230" height="40" rx="6" fill="var(--bg-card)" stroke="var(--pink)" stroke-width=".5"/>
<text class="s-lbl" x="170" y="104" text-anchor="middle" dominant-baseline="central">Prompt + rubric</text>
<rect x="55" y="152" width="230" height="40" rx="6" fill="var(--bg-card)" stroke="var(--pink)" stroke-width=".5"/>
<text class="s-lbl" x="170" y="172" text-anchor="middle" dominant-baseline="central">Generate prose</text>
<rect x="55" y="220" width="230" height="40" rx="6" fill="var(--bg-card)" stroke="var(--pink)" stroke-width=".5"/>
<text class="s-lbl" x="170" y="240" text-anchor="middle" dominant-baseline="central">Parse the JSON</text>
<line x1="170" y1="124" x2="170" y2="149" class="s-arr" stroke="var(--pink)" marker-end="url(#a1)"/>
<line x1="170" y1="192" x2="170" y2="217" class="s-arr" stroke="var(--pink)" marker-end="url(#a1)"/>
<text class="s-mono" x="170" y="298" text-anchor="middle" fill="var(--cyan)">seconds · $$$ · brittle</text>
<rect x="395" y="84" width="230" height="40" rx="6" fill="var(--bg-card)" stroke="var(--green)" stroke-width=".5"/>
<text class="s-lbl" x="510" y="104" text-anchor="middle" dominant-baseline="central">One Jev call</text>
<rect x="382" y="176" width="80" height="40" rx="6" fill="var(--bg-card)" stroke="var(--yellow)" stroke-width=".5"/>
<text class="s-mono" x="422" y="196" text-anchor="middle" dominant-baseline="central" fill="var(--yellow)">Choice</text>
<rect x="470" y="176" width="80" height="40" rx="6" fill="var(--bg-card)" stroke="var(--orange)" stroke-width=".5"/>
<text class="s-mono" x="510" y="196" text-anchor="middle" dominant-baseline="central" fill="var(--orange)">Score</text>
<rect x="558" y="176" width="80" height="40" rx="6" fill="var(--bg-card)" stroke="var(--purple)" stroke-width=".5"/>
<text class="s-mono" x="598" y="196" text-anchor="middle" dominant-baseline="central" fill="var(--purple)">Noul</text>
<line x1="470" y1="124" x2="428" y2="174" class="s-arr" stroke="var(--green)" marker-end="url(#a1)"/>
<line x1="510" y1="124" x2="510" y2="174" class="s-arr" stroke="var(--green)" marker-end="url(#a1)"/>
<line x1="550" y1="124" x2="592" y2="174" class="s-arr" stroke="var(--green)" marker-end="url(#a1)"/>
<text class="s-sub" x="510" y="244" text-anchor="middle">typed, parallel, RLCD-calibrated</text>
<text class="s-mono" x="510" y="298" text-anchor="middle" fill="var(--cyan)">70-500ms · $0.042/M in</text>
