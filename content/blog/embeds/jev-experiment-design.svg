<svg viewBox="0 0 760 270" role="img" aria-labelledby="t2 d2">
<title id="t2">Experiment design</title>
<desc id="d2">A human-labeled golden set is judged in parallel by the current LLM judge and by Jev, then compared on agreement, calibration, latency and cost.</desc>
