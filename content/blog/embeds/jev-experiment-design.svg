<rect x="20" y="103" width="170" height="64" rx="8" fill="var(--bg-card)" stroke="var(--border-md)" stroke-width=".5"/>
<text class="s-lbl" x="105" y="127" text-anchor="middle" dominant-baseline="central">Golden set</text>
<text class="s-sub" x="105" y="147" text-anchor="middle" dominant-baseline="central">human-labeled</text>
<rect x="290" y="44" width="190" height="64" rx="8" fill="var(--bg-card)" stroke="var(--pink)" stroke-width=".5"/>
<text class="s-lbl" x="385" y="68" text-anchor="middle" dominant-baseline="central">Current LLM judge</text>
<text class="s-sub" x="385" y="88" text-anchor="middle" dominant-baseline="central">baseline</text>
<rect x="290" y="162" width="190" height="64" rx="8" fill="var(--bg-card)" stroke="var(--green)" stroke-width=".5"/>
<text class="s-lbl" x="385" y="186" text-anchor="middle" dominant-baseline="central">Jev judge</text>
<text class="s-sub" x="385" y="206" text-anchor="middle" dominant-baseline="central">candidate</text>
<rect x="570" y="103" width="170" height="64" rx="8" fill="var(--bg-card)" stroke="var(--cyan)" stroke-width=".5"/>
<text class="s-lbl" x="655" y="127" text-anchor="middle" dominant-baseline="central">Compare</text>
<text class="s-sub" x="655" y="147" text-anchor="middle" dominant-baseline="central">agree · calibrate · time · $</text>
<line x1="190" y1="125" x2="286" y2="86" class="s-arr" marker-end="url(#a2)"/>
<line x1="190" y1="145" x2="286" y2="184" class="s-arr" marker-end="url(#a2)"/>
<line x1="480" y1="86" x2="566" y2="125" class="s-arr" marker-end="url(#a2)"/>
