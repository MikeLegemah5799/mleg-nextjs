<svg viewBox="0 0 760 320" role="img" aria-labelledby="t4 d4">
<title id="t4">Six eval harnesses connecting to Jev through one judge adapter</title>
<desc id="d4">LangSmith, Langfuse, Braintrust, Amazon Bedrock AgentCore Evaluations, Strands Evals and DeepEval each connect to a single thin judge adapter, which calls Jev.</desc>
<defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="var(--bg-card)" stroke="var(--cyan)" stroke-width=".5">
<rect x="20" y="24" width="210" height="34" rx="6"/><rect x="20" y="70" width="210" height="34" rx="6"/><rect x="20" y="116" width="210" height="34" rx="6"/>
<rect x="20" y="162" width="210" height="34" rx="6"/><rect x="20" y="208" width="210" height="34" rx="6"/><rect x="20" y="254" width="210" height="34" rx="6"/>
</g>
<g class="s-mono" fill="var(--text)" text-anchor="middle" dominant-baseline="central">
<text x="125" y="41">LangSmith</text><text x="125" y="87">Langfuse</text><text x="125" y="133">Braintrust</text>
<text x="125" y="179" style="font-size:11px">Bedrock AgentCore Evals</text><text x="125" y="225">Strands Evals</text><text x="125" y="271">DeepEval</text>
</g>
<rect x="320" y="116" width="170" height="80" rx="8" fill="var(--bg-card)" stroke="var(--yellow)" stroke-width=".5"/>
<text class="s-lbl" x="405" y="144" text-anchor="middle" dominant-baseline="central">Judge adapter</text>
<text class="s-sub" x="405" y="166" text-anchor="middle" dominant-baseline="central">thin custom scorer</text>
<rect x="580" y="116" width="160" height="80" rx="8" fill="var(--bg-card)" stroke="var(--green)" stroke-width=".5"/>
<text class="s-lbl" x="660" y="144" text-anchor="middle" dominant-baseline="central">Jev</text>
<text class="s-sub" x="660" y="166" text-anchor="middle" dominant-baseline="central">typed results back</text>
<g class="s-arr" stroke="var(--soft)" stroke-width="1">
<line x1="232" y1="41" x2="316" y2="142" marker-end="url(#a4)"/><line x1="232" y1="87" x2="316" y2="148" marker-end="url(#a4)"/>
<line x1="232" y1="133" x2="316" y2="154" marker-end="url(#a4)"/><line x1="232" y1="179" x2="316" y2="160" marker-end="url(#a4)"/>
<line x1="232" y1="225" x2="316" y2="166" marker-end="url(#a4)"/><line x1="232" y1="271" x2="316" y2="172" marker-end="url(#a4)"/>
</g>
<line x1="492" y1="156" x2="576" y2="156" class="s-arr" stroke="var(--green)" marker-end="url(#a4)"/>
</svg>
